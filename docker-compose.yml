services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stockflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - stockflow_sql_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockflow-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=StockFlowDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "StockFlow.Api"
      Jwt__Audience: "StockFlow.Client"
      Jwt__ExpirationMinutes: "60"

    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  stockflow_sql_data: